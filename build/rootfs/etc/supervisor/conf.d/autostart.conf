[program:webserver]
user=nobody
directory=/home/nobody
command=/bin/bash -c '/opt/fs25/start_webserver.sh'
autostart=%(ENV_AUTOSTART_ENABLED)s
autorestart=true
stdout_logfile=/var/log/giants_webserver.log
stderr_logfile=/var/log/giants_webserver.err
environment=DISPLAY=":1",HOME="/home/nobody",USER="nobody"

[program:gameserver]
user=nobody
directory=/home/nobody
command=/bin/bash -c '/opt/fs25/start_gameserver.sh'
autostart=%(ENV_AUTOSTART_ENABLED)s
autorestart=false
startsecs=15
stdout_logfile=/var/log/giants_gameserver.log
stderr_logfile=/var/log/giants_gameserver.err
environment=DISPLAY=":1",HOME="/home/nobody",USER="nobody"
